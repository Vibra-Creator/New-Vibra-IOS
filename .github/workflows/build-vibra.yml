name: Vibra iOS - Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRORE: ZIP non trovato"
            exit 1
          fi

          echo "ZIP trovato: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "=== CONTENUTO ESTRATTO ==="
          find extracted -maxdepth 5 -print

      - name: Locate Xcode project
        run: |
          set -e

          WORKSPACE=$(find extracted -type d -name "*.xcworkspace" | head -1)
          PROJECT=$(find extracted -type d -name "*.xcodeproj" | head -1)

          if [ -n "$WORKSPACE" ]; then
            echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
            echo "Trovato workspace: $WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
            echo "Trovato project: $PROJECT"
          else
            echo "ERRORE: nessun progetto Xcode trovato"
            exit 1
          fi

      - name: Check Xcode
        run: |
          xcodebuild -version

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Install Pods
        run: |
          PODFILE=$(find extracted -name "Podfile" -print -quit)

          if [ -n "$PODFILE" ]; then
            echo "Podfile trovato: $PODFILE"
            cd "$(dirname "$PODFILE")"
            pod install
          else
            echo "Podfile non trovato"
          fi

      - name: Show Xcode schemes
        run: |
          if [ -n "$WORKSPACE" ]; then
            xcodebuild -workspace "$WORKSPACE" -list
          else
            xcodebuild -project "$PROJECT" -list
          fi

      - name: Create signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            build.keychain

          security set-keychain-settings \
            -lut 21600 \
            build.keychain

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            build.keychain

          security list-keychains -d user -s \
            build.keychain login.keychain-db

      - name: Import Apple Distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          echo "=== VERIFICA FILE P12 ==="
          ls -lh certificate.p12

          echo "=== VERIFICA PASSWORD P12 ==="
          openssl pkcs12 \
            -in certificate.p12 \
            -info \
            -noout \
            -passin pass:"$P12_PASSWORD"

          echo "=== IMPORT CERTIFICATO ==="

          security import certificate.p12 \
            -k build.keychain \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain

          echo "=== IDENTITA DISPONIBILI ==="

          security find-identity \
            -v -p codesigning \
            build.keychain

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > profile.mobileprovision

          PROFILE_UUID=$(
            security cms -D -i profile.mobileprovision |
            /usr/libexec/PlistBuddy -c "Print:UUID"
          )

          PROFILE_NAME=$(
            security cms -D -i profile.mobileprovision |
            /usr/libexec/PlistBuddy -c "Print:Name"
          )

          cp profile.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Profilo: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"

      - name: Archive Vibra
        run: |
          set -o pipefail
          mkdir -p build

          if [ -n "$WORKSPACE" ]; then
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "Vibra" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$PWD/build/Vibra.xcarchive" \
              DEVELOPMENT_TEAM="MA8PHU39TR" \
              CODE_SIGN_STYLE="Manual" \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="VibraAppStoreNew" \
              PRODUCT_BUNDLE_IDENTIFIER="com.vibraalienmatch" \
              clean archive \
              | tee archive.log
          else
            xcodebuild \
              -project "$PROJECT" \
              -scheme "Vibra" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$PWD/build/Vibra.xcarchive" \
              DEVELOPMENT_TEAM="MA8PHU39TR" \
              CODE_SIGN_STYLE="Manual" \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="VibraAppStoreNew" \
              PRODUCT_BUNDLE_IDENTIFIER="com.vibraalienmatch" \
              clean archive \
              | tee archive.log
          fi

      - name: Create ExportOptions
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>MA8PHU39TR</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.vibraalienmatch</key>
                  <string>VibraAppStoreNew</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          set -o pipefail

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/Vibra.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist ExportOptions.plist \
            | tee export.log

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vibra-iOS-IPA
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: Vibra-iOS-Build-Logs
          path: |
            archive.log
            export.log
