name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Unzip project
      run: |
        unzip Vibra.zip -d project

    - name: Install CocoaPods
      run: |
        sudo gem install cocoapods
        cd project/src
        pod install

    - name: Build archive
      run: |
        cd project/src
        xcodebuild \
          -workspace Vibra.xcworkspace \
          -scheme Vibra \
          -configuration Release \
          -archivePath build/Vibra.xcarchive \
          archive

    - name: Export unsigned IPA
      run: |
        cd project/src
        xcodebuild \
          -exportArchive \
          -archivePath build/Vibra.xcarchive \
          -exportPath build/ipa \
          -exportOptionsPlist exportOptions.plist

    - name: Decode certificate
      run: |
        echo "$IOS_CERT" | base64 --decode > ios_cert.p12

    - name: Install certificate
      run: |
        security import ios_cert.p12 -P "$IOS_CERT_PASSWORD" -A

    - name: Install provisioning profile
      run: |
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        echo "$IOS_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/Vibra.mobileprovision

    - name: Re-sign IPA
      run: |
        cd project/src/build/ipa
        mkdir Payload
        unzip Vibra.ipa -d Payload
        codesign -f -s "Apple Distribution" Payload/Payload/Vibra.app
        zip -r SignedVibra.ipa Payload

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v3
      with:
        name: SignedVibra
        path: project/src/build/ipa/SignedVibra.ipa
