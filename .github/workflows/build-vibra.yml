name: Vibra iOS - Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRORE: ZIP non trovato"
            exit 1
          fi

          echo "ZIP trovato: $ZIP_FILE"

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== CONTENUTO ESTRATTO ==="
          find extracted -maxdepth 5 -print

      - name: Check Xcode
        run: |
          xcodebuild -version

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Install Pods
        run: |
          PODFILE=$(find extracted -name "Podfile" -print -quit)

          if [ -n "$PODFILE" ]; then

            echo "Podfile trovato: $PODFILE"

            cd "$(dirname "$PODFILE")"

            pod install

            echo "=== POD INSTALL COMPLETATO ==="
            ls -la

          else

            echo "ERRORE: Podfile non trovato"
            exit 1

          fi

      - name: Locate Xcode project
        run: |
          set -e

          echo "=== CERCO WORKSPACE COCOAPODS ==="

          WORKSPACE=$(find extracted \
            -type d \
            -name "Vibra.xcworkspace" \
            ! -path "*/Vibra.xcodeproj/*" \
            | head -1)

          PROJECT=$(find extracted \
            -type d \
            -name "Vibra.xcodeproj" \
            | head -1)

          if [ -n "$WORKSPACE" ]; then

            echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"

            echo "Workspace trovato:"
            echo "$WORKSPACE"

          elif [ -n "$PROJECT" ]; then

            echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

            echo "Project trovato:"
            echo "$PROJECT"

          else

            echo "ERRORE: nessun progetto Xcode trovato"

            echo "=== WORKSPACE ==="
            find extracted -type d -name "*.xcworkspace" -print

            echo "=== XCODEPROJ ==="
            find extracted -type d -name "*.xcodeproj" -print

            exit 1

          fi

      - name: Show Xcode schemes
        run: |

          echo "=== SCHEMI XCODE ==="

          if [ -n "$WORKSPACE" ]; then

            echo "Workspace:"
            echo "$WORKSPACE"

            xcodebuild \
              -workspace "$WORKSPACE" \
              -list

          elif [ -n "$PROJECT" ]; then

            echo "Project:"
            echo "$PROJECT"

            xcodebuild \
              -project "$PROJECT" \
              -list

          else

            echo "ERRORE: nessun workspace/project disponibile"
            exit 1

          fi

      - name: Create signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            build.keychain

          security set-keychain-settings \
            -lut 21600 \
            build.keychain

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            build.keychain

          security list-keychains \
            -d user \
            -s build.keychain login.keychain-db

      - name: Import Apple Distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |

          set -e

          echo "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode > certificate.p12

          echo "=== VERIFICA FILE P12 ==="

          ls -lh certificate.p12

          echo "=== VERIFICA PASSWORD P12 ==="

          openssl pkcs12 \
            -in certificate.p12 \
            -info \
            -noout \
            -passin pass:"$P12_PASSWORD"

          echo "=== IMPORT CERTIFICATO ==="

          security import certificate.p12 \
            -k build.keychain \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain

          echo "=== IDENTITA DISPONIBILI ==="

          security find-identity \
            -v \
            -p codesigning \
            build.keychain

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |

          set -e

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "=== DECODIFICA PROFILO ==="

          printf '%s' "$PROVISIONING_PROFILE_BASE64" \
            | base64 --decode > profile.mobileprovision

          echo "=== FILE CREATO ==="

          ls -lh profile.mobileprovision

          file profile.mobileprovision

          echo "=== LETTURA PROFILO APPLE ==="

          security cms \
            -D \
            -i profile.mobileprovision \
            > profile.plist

          echo "=== PROFILO DECODIFICATO ==="

          /usr/libexec/PlistBuddy \
            -c "Print:Name" \
            profile.plist

          /usr/libexec/PlistBuddy \
            -c "Print:UUID" \
            profile.plist

          /usr/libexec/PlistBuddy \
            -c "Print:TeamIdentifier:0" \
            profile.plist

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print:UUID" \
              profile.plist
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print:Name" \
              profile.plist
          )

          cp profile.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Profilo: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"

      - name: Disable signing for CocoaPods
        run: |

          set -e

          echo "=== DISABILITO CODE SIGNING DEI PODS ==="

          PODS_PROJECT=$(find extracted \
            -type f \
            -path "*/Pods/Pods.xcodeproj/project.pbxproj" \
            | head -1)

          if [ -z "$PODS_PROJECT" ]; then

            echo "ERRORE: Pods.xcodeproj non trovato"
            exit 1

          fi

          echo "Pods project:"
          echo "$PODS_PROJECT"

          python3 <<PY
          from pathlib import Path

          path = Path("$PODS_PROJECT")

          text = path.read_text()

          text = text.replace(
              "CODE_SIGNING_ALLOWED = YES;",
              "CODE_SIGNING_ALLOWED = NO;"
          )

          text = text.replace(
              "CODE_SIGNING_REQUIRED = YES;",
              "CODE_SIGNING_REQUIRED = NO;"
          )

          text = text.replace(
              "CODE_SIGN_STYLE = Manual;",
              "CODE_SIGN_STYLE = Automatic;"
          )

          text = text.replace(
              "PROVISIONING_PROFILE_SPECIFIER = VibraAppStoreNew;",
              "PROVISIONING_PROFILE_SPECIFIER = \"\";"
          )

          text = text.replace(
              "PROVISIONING_PROFILE = VibraAppStoreNew;",
              "PROVISIONING_PROFILE = \"\";"
          )

          path.write_text(text)

          print("Signing Pods disabilitato.")
          PY

          echo "=== VERIFICA PODS ==="

          grep -n "CODE_SIGNING_ALLOWED" "$PODS_PROJECT" | head -20 || true

      - name: Configure Vibra signing
        run: |

          set -e

          echo "=== CONFIGURO FIRMA APP VIBRA ==="

          VIBRA_PROJECT=$(find extracted \
            -type f \
            -path "*/Vibra.xcodeproj/project.pbxproj" \
            | head -1)

          if [ -z "$VIBRA_PROJECT" ]; then

            echo "ERRORE: project.pbxproj Vibra non trovato"
            exit 1

          fi

          echo "Project Vibra:"
          echo "$VIBRA_PROJECT"

          python3 <<PY
          from pathlib import Path

          path = Path("$VIBRA_PROJECT")

          text = path.read_text()

          text = text.replace(
              "DEVELOPMENT_TEAM = \"\";",
              "DEVELOPMENT_TEAM = MA8PHU39TR;"
          )

          text = text.replace(
              "CODE_SIGN_STYLE = Automatic;",
              "CODE_SIGN_STYLE = Manual;"
          )

          path.write_text(text)

          print("Configurazione signing Vibra completata.")
          PY

          echo "=== CONTROLLO TEAM ==="

          grep -n "DEVELOPMENT_TEAM" "$VIBRA_PROJECT" | head -20 || true

      - name: Archive Vibra
        run: |

          set -e
          set -o pipefail

          mkdir -p build

          echo "=== CERCO WORKSPACE COCOAPODS ==="

          WORKSPACE=$(find extracted \
            -type d \
            -name "Vibra.xcworkspace" \
            ! -path "*/Vibra.xcodeproj/*" \
            | head -1)

          if [ -z "$WORKSPACE" ]; then

            echo "ERRORE: workspace CocoaPods Vibra.xcworkspace non trovato"

            echo "=== WORKSPACE TROVATI ==="

            find extracted \
              -type d \
              -name "*.xcworkspace" \
              -print

            exit 1

          fi

          echo "=== WORKSPACE CORRETTO ==="
          echo "$WORKSPACE"

          echo "=== ARCHIVE VIBRA ==="

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "Vibra" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/Vibra.xcarchive" \
            DEVELOPMENT_TEAM="MA8PHU39TR" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PRODUCT_BUNDLE_IDENTIFIER="com.vibraalienmatch" \
            CODE_SIGNING_ALLOWED="YES" \
            clean archive \
            | tee archive.log

      - name: Check Archive
        run: |

          set -e

          echo "=== CONTROLLO ARCHIVIO ==="

          if [ ! -d "build/Vibra.xcarchive" ]; then

            echo "ERRORE: archivio non creato"

            exit 1

          fi

          echo "Archivio trovato:"
          ls -lah build/Vibra.xcarchive

      - name: Create ExportOptions
        run: |

          cat > ExportOptions.plist <<'EOF'

          <?xml version="1.0" encoding="UTF-8"?>

          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">

          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>MA8PHU39TR</string>

              <key>provisioningProfiles</key>

              <dict>

                  <key>com.vibraalienmatch</key>
                  <string>VibraAppStoreNew</string>

              </dict>

          </dict>

          </plist>

          EOF

          echo "=== EXPORT OPTIONS ==="

          cat ExportOptions.plist

      - name: Export IPA
        run: |

          set -e
          set -o pipefail

          echo "=== ESPORTAZIONE IPA ==="

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/Vibra.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist ExportOptions.plist \
            | tee export.log

          echo "=== FILE ESPORTATI ==="

          find build/export -maxdepth 2 -type f -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4

        with:
          name: Vibra-iOS-IPA
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload logs
        uses: actions/upload-artifact@v4

        with:
          name: Vibra-iOS-Build-Logs
          path: |
            archive.log
            export.log
