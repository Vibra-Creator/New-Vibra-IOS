name: Generate CSR

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate private key and CSR
        run: |
          openssl genrsa -out private.key 2048
          openssl req -new -key private.key -out request.csr -subj "/CN=Vibra"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibra-cert-files
          path: |
            private.key
            request.csr
