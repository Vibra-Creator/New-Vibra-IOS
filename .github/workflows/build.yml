name: Build iOS App Store

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Decode and install Distribution certificate
        run: |
          echo "${IOS_CERT}" | base64 --decode > cert.p12
          security import cert.p12 -P "${IOS_CERT_PASSWORD}" -A

      - name: Install App Store provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${IOS_PROFILE}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/AppStore.mobileprovision

      - name: Install dependencies
        run: |
          npm install
          npm run build

      - name: Sync Capacitor
        run: |
          npx cap sync ios

      - name: Build archive
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive archive

      - name: Export IPA for App Store
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build \
            -exportOptionsPlist ios/exportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibra-AppStore
          path: build/*.ipa
