name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    # 🔹 Genera il certificato P12 direttamente su macOS
    - name: Generate P12 on macOS
      run: |
        openssl pkcs12 -export \
          -inkey private.key \
          -in distribution.cer \
          -out cert.p12 \
          -passout pass:vibra2024

    # 🔹 Crea e sblocca il keychain temporaneo
    - name: Create keychain
      run: |
        security create-keychain -p "" build.keychain
        security set-keychain-settings build.keychain
        security unlock-keychain -p "" build.keychain

    # 🔹 Importa il certificato nel keychain
    - name: Import certificate
      run: |
        security import cert.p12 -k build.keychain -P "vibra2024" -T /usr/bin/codesign
        security list-keychains -s build.keychain

    # 🔹 Installa il provisioning profile
    - name: Install provisioning profile
      run: |
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp VibraStore.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

    # 🔹 Estrae il progetto
    - name: Unzip project
      run: unzip Vibra.zip -d .

    # 🔹 Compila e archivia l’app
    - name: Build
      run: |
        xcodebuild \
          -workspace Vibra.xcworkspace \
          -scheme Vibra \
          -configuration Release \
          -archivePath build/Vibra.xcarchive \
          archive
