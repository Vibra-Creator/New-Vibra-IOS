name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Unzip project
      run: unzip "Vibra.zip" -d project

    - name: Find project folder (Podfile)
      run: |
        PROJECT_DIR=$(find project -type f -name "Podfile" -exec dirname {} \;)
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Install CocoaPods
      run: |
        sudo gem install cocoapods
        cd "$PROJECT_DIR"
        pod install

    - name: Build archive
      run: |
        cd "$PROJECT_DIR"
        xcodebuild \
          -workspace Vibra.xcworkspace \
          -scheme Vibra \
          -configuration Release \
          -archivePath build/Vibra.xcarchive \
          archive
