name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Unzip Vibra.zip
      run: unzip "Vibra.zip" -d project

    - name: Enter Vibra folder
      run: |
        cd project/Vibra
        ls -la

    - name: Install CocoaPods
      run: |
        cd project/Vibra
        sudo gem install cocoapods
        pod install

    - name: Build archive
      run: |
        cd project/Vibra
        xcodebuild \
          -workspace Vibra.xcworkspace \
          -scheme Vibra \
          -configuration Release \
          -archivePath build/Vibra.xcarchive \
          archive
