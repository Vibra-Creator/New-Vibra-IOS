name: Build iOS IPA (Manual Signing)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # Install certificate (.p12)
    - name: Install signing certificate
      run: |
        echo "${IOS_CERT_P12}" | base64 --decode > cert.p12
        security import cert.p12 -P "${IOS_CERT_PASSWORD}" -A
      env:
        IOS_CERT_P12: ${{ secrets.IOS_CERT_P12 }}
        IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}

    # Install provisioning profile (.mobileprovision)
    - name: Install provisioning profile
      run: |
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        echo "${IOS_PROFILE}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/VibraStore.mobileprovision
      env:
        IOS_PROFILE: ${{ secrets.IOS_PROFILE }}

    # Unzip project
    - name: Unzip Vibra.zip
      run: unzip "Vibra.zip" -d project

    # Install CocoaPods
    - name: Install CocoaPods
      run: |
        cd project/Vibra
        sudo gem install cocoapods
        pod install

    # Build archive with MANUAL SIGNING
    - name: Build archive
      run: |
        cd project/Vibra
        xcodebuild \
          -workspace Vibra.xcworkspace \
          -scheme Vibra \
          -configuration Release \
          -archivePath build/Vibra.xcarchive \
          CODE
