name: Generate CSR

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: macos-latest

    steps:
    - name: Generate private key
      run: |
        openssl genrsa -out private.key 2048
        ls -l private.key

    - name: Generate CSR
      run: |
        openssl req -new -key private.key -out request.csr -subj "/CN=Fabio"
        cat request.csr

    - name: Upload key and CSR as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-cert-files
        path: |
          private.key
          request.csr
