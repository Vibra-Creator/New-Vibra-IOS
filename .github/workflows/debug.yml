name: Debug ZIP Structure

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Unzip project
      run: |
        unzip "Vibra.zip" -d project

    - name: List project folder
      run: |
        echo "=== Contenuto di project ==="
        ls -R project
